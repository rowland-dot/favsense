name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/resource-utils.mjs
          node --check site/local-bridge-utils.mjs
          node --check scripts/serve-site.mjs
          node --check scripts/verify-release.mjs
          node --check skills/xhs-favorites-organizer/scripts/build-public-site.mjs
          node --check skills/xhs-favorites-organizer/scripts/build-knowledge-base.mjs

      - name: Test public site and deterministic builders
        run: npm test

      - name: Test local bridge contracts
        run: python3 skills/xhs-favorites-organizer/tests/test_bridge.py

      - name: Verify open-source release boundary
        run: npm run verify
