name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  release-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked Node dependencies
        run: npm ci

      - name: Install Chromium on Ubuntu
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx.cmd playwright install chromium

      - name: Check JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/resource-utils.mjs
          node --check site/local-bridge-utils.mjs
          node --check scripts/serve-site.mjs
          node --check scripts/verify-release.mjs
          node --check scripts/run-python-tests.mjs
          node --check skills/xhs-favorites-organizer/scripts/build-public-site.mjs
          node --check skills/xhs-favorites-organizer/scripts/build-knowledge-base.mjs

      - name: Run the complete release gate
        run: npm run release:check

      - name: Keep browser test traces when the release gate fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Windows setup safety contracts
        if: runner.os == 'Windows'
        run: npm.cmd run test:windows-contracts

      - name: Verify PR development lifecycle
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-development-lifecycle.mjs
