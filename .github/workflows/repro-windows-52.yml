name: Repro ERR_NO_BUFFER_SPACE (temporary, issue 52)

# Temporary: runs the Windows release gate many times at once so a failure lands in a run that has evidence.
# Earlier rounds: the plain gate reproduced the failure (a browser request refused with ERR_NO_BUFFER_SPACE,
# 1 of 20 runs) while the gate under a once-per-second connection logger did not (0 of 92). The modes below
# find out whether the logger's sampling rate, or merely wrapping the gate, is what hides it.
# Removed before the branch is merged.

on:
  push:
    branches: [fix/windows-ci-connection-exhaustion]

permissions:
  contents: read

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, logged15, nosample]
        replica: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked Node dependencies
        run: npm ci

      - name: Install Chromium on Windows
        run: npx.cmd playwright install chromium

      - name: Run the gate plain
        if: matrix.mode == 'plain'
        run: npm run release:check

      - name: Run the gate under the logger sampling every 15 seconds
        if: matrix.mode == 'logged15'
        run: node scripts/connection-log.mjs --out ci-diagnostics --interval-ms 15000 -- npm run release:check

      - name: Run the gate under the logger with no sampling between start and end
        if: matrix.mode == 'nosample'
        run: node scripts/connection-log.mjs --out ci-diagnostics --interval-ms 3600000 -- npm run release:check

      - name: Keep the connection log
        if: always() && matrix.mode != 'plain'
        uses: actions/upload-artifact@v4
        with:
          name: connection-log-${{ matrix.mode }}-${{ matrix.replica }}-${{ github.run_attempt }}
          path: ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep browser test traces when the release gate fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.mode }}-${{ matrix.replica }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
