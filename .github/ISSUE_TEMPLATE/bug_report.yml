name: Bug 报告
description: 报告可复现的同步、整理或网页问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请先删除截图、日志和配置中的 Cookie、Token、个人主页与收藏夹 ID。
  - type: textarea
    id: problem
    attributes:
      label: 问题现象
      description: 实际发生了什么？你预期发生什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      placeholder: |
        1. 运行 …
        2. 打开 …
        3. 看到 …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或 commit
      placeholder: v0.1.0 / abc1234
  - type: dropdown
    id: area
    attributes:
      label: 影响区域
      options: [本地同步, 知识整理, 网页界面, 资源雷达, 部署, 文档, 其他]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除 Cookie、Token、个人主页、收藏夹 ID 和本地绝对路径
          required: true
